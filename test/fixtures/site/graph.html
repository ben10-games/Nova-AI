<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Practice: Reading a Graph</title><style>body{font:16px sans-serif;margin:20px}</style></head>
<body>
  <main>
    <h1>Reading a graph</h1>
    <p><b>Problem 1.</b> Use the graph of the line below. According to the graph, what is y when x = 3?</p>
    <!-- The points exist only as drawing: grid lines every 1 unit, no value labels on the points. -->
    <svg width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Line graph">
      <rect x="0" y="0" width="320" height="320" fill="#fff"/>
      <g stroke="#ddd">
        <line x1="40" y1="20" x2="40" y2="300"/><line x1="80" y1="20" x2="80" y2="300"/><line x1="120" y1="20" x2="120" y2="300"/><line x1="160" y1="20" x2="160" y2="300"/><line x1="200" y1="20" x2="200" y2="300"/><line x1="240" y1="20" x2="240" y2="300"/><line x1="280" y1="20" x2="280" y2="300"/>
        <line x1="40" y1="300" x2="300" y2="300"/><line x1="40" y1="272" x2="300" y2="272"/><line x1="40" y1="244" x2="300" y2="244"/><line x1="40" y1="216" x2="300" y2="216"/><line x1="40" y1="188" x2="300" y2="188"/><line x1="40" y1="160" x2="300" y2="160"/><line x1="40" y1="132" x2="300" y2="132"/><line x1="40" y1="104" x2="300" y2="104"/><line x1="40" y1="76" x2="300" y2="76"/><line x1="40" y1="48" x2="300" y2="48"/>
      </g>
      <g stroke="#000" stroke-width="2"><line x1="40" y1="300" x2="300" y2="300"/><line x1="40" y1="20" x2="40" y2="300"/></g>
      <g font-size="12" fill="#333">
        <text x="36" y="316">0</text><text x="76" y="316">1</text><text x="116" y="316">2</text><text x="156" y="316">3</text><text x="196" y="316">4</text><text x="236" y="316">5</text>
        <text x="24" y="304">0</text><text x="24" y="248">2</text><text x="24" y="192">4</text><text x="24" y="136">6</text><text x="24" y="80">8</text><text x="16" y="24">10</text>
      </g>
      <polyline points="40,272 80,216 120,160 160,104 200,48" fill="none" stroke="#2563eb" stroke-width="3"/>
      <g fill="#2563eb"><circle cx="40" cy="272" r="4"/><circle cx="80" cy="216" r="4"/><circle cx="120" cy="160" r="4"/><circle cx="160" cy="104" r="4"/><circle cx="200" cy="48" r="4"/></g>
    </svg>
    <p><label for="ans">Answer</label> <input id="ans" type="text"></p>
    <h2>Bar chart</h2>
    <svg width="260" height="160" role="img" aria-label="Bar chart">
      <rect x="20" y="100" width="40" height="50" fill="#16a34a"/>
      <rect x="80" y="20" width="40" height="130" fill="#dc2626"/>
      <rect x="140" y="70" width="40" height="80" fill="#2563eb"/>
      <line x1="10" y1="150" x2="250" y2="150" stroke="#000"/>
    </svg>
  </main>
</body>
</html>
